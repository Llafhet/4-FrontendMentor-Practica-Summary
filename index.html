<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <article class="card">

    <img src="images/illustration-hero.svg" alt="" class="image">
    <div class="texts">
      <h1 class="card__title"> Order Summary</h1>
      <p class="card__paragraph">You can now listen to millions of songs, <br> audiobooks, and podcasts on any 
      device <br>anywhere you like!</p>
        <div class="plan">
          <img src="images/icon-music.svg" class="image2">
          <div class="text--column"> 
            <p class="anual">Annual Plan</p>
            <p class="year">$59.99/year</p>
          </div>
         
          <a href="#" class="change">Change</a>
        </div>
    </div>

    <div class="butons">
      <button class="buton buton--proceed"> Proceed to Payment</button>
      <button class="buton buton--cancel">Cancel Order</button>
    </div>
  </article>

</body>
</html>
